---
deployment:
  tasks:
    # cPanel runs these on "Update from Remote -> Deploy HEAD Commit".
    # dumpcat.com is a holding domain: a coming-soon page at the root, plus each
    # sample site served from /samples/<niche>/ (the committed Eleventy _site/ build).
    - export DEPLOYPATH=/home/dumpcat/public_html/
    - /bin/mkdir -p $DEPLOYPATH

    # --- Root: coming-soon page + crawler/icon files ---
    - /bin/cp index.html robots.txt favicon.svg $DEPLOYPATH

    # --- Template 01 (Clean Light — garage door reference) ---
    - /bin/mkdir -p ${DEPLOYPATH}samples/template-01/
    - /bin/cp -R samples/template-01/_site/. ${DEPLOYPATH}samples/template-01/

    # --- Template 02 (Bold Dark — electrician reference) ---
    - /bin/mkdir -p ${DEPLOYPATH}samples/template-02/
    - /bin/cp -R samples/template-02/_site/. ${DEPLOYPATH}samples/template-02/

    # --- Template 03 (Airy Light — screen enclosure reference) ---
    - /bin/mkdir -p ${DEPLOYPATH}samples/template-03/
    - /bin/cp -R samples/template-03/_site/. ${DEPLOYPATH}samples/template-03/

    # --- Template 04 (Warm Personal — handyman reference) ---
    - /bin/mkdir -p ${DEPLOYPATH}samples/template-04/
    - /bin/cp -R samples/template-04/_site/. ${DEPLOYPATH}samples/template-04/

    # --- Template 05 (Urgent Direct — plumbing reference) ---
    - /bin/mkdir -p ${DEPLOYPATH}samples/template-05/
    - /bin/cp -R samples/template-05/_site/. ${DEPLOYPATH}samples/template-05/

    # --- Template 06 (Professional Trade — HVAC reference) ---
    - /bin/mkdir -p ${DEPLOYPATH}samples/template-06/
    - /bin/cp -R samples/template-06/_site/. ${DEPLOYPATH}samples/template-06/

    # --- kit-test: template-kit real-cPanel-hosting proof (PHP, not Eleventy —
    #     ships as-is, no _site/ build step) ---
    - /bin/mkdir -p ${DEPLOYPATH}kit-test/
    - /bin/cp -R kit-test/. ${DEPLOYPATH}kit-test/

    # When a sample graduates to its own domain, delete its source folder AND remove
    # its two copy lines above so it stops deploying to dumpcat.com.
