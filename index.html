<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DumpCat — Coming Soon</title>
  <meta name="description" content="DumpCat is coming soon.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14253b">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #14253b;
      --navy-deep: #0e1a2b;
      --orange: #f26419;
      --muted: #aebccb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    body::after {
      content: "";
      position: absolute;
      width: 520px; height: 520px;
      background: radial-gradient(circle, rgba(242,100,25,0.18), transparent 70%);
      top: -120px; right: -120px;
      pointer-events: none;
    }
    .wrap { position: relative; z-index: 1; max-width: 540px; }
    .logo {
      display: inline-flex; align-items: center; gap: 12px;
      margin-bottom: 28px;
    }
    .logo svg { width: 46px; height: 46px; }
    .logo span {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700; font-size: 2.1rem; text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .logo span b { color: var(--orange); }
    .eyebrow {
      display: inline-block; font-weight: 600; font-size: 0.78rem;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--orange);
      margin-bottom: 16px;
    }
    h1 {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700; font-size: clamp(2.4rem, 7vw, 3.6rem);
      line-height: 1.05; margin-bottom: 16px;
    }
    p { color: var(--muted); font-size: 1.1rem; line-height: 1.6; }
    .dot { color: var(--orange); }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#f26419" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M3 14h18M8 4v16"/>
      </svg>
      <span>Dump<b>Cat</b></span>
    </div>
    <span class="eyebrow">Coming Soon</span>
    <h1>Something's being built here<span class="dot">.</span></h1>
    <p>We're putting the finishing touches on it. Check back soon.</p>
  </main>
</body>
</html>
