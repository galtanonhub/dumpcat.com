<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Your Name Electric</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --dark:#111827; --yellow:#FFD60A; --muted:#9CA3AF; --font:"DM Sans",system-ui,sans-serif; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:var(--font); background:var(--dark); color:#F9FAFB; display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:2rem; }
    h1 { font-size:5rem; font-weight:800; color:var(--yellow); line-height:1; margin-bottom:0.5rem; }
    h2 { font-size:1.5rem; font-weight:700; margin-bottom:1rem; }
    p  { color:var(--muted); margin-bottom:2rem; }
    a  { display:inline-block; background:var(--yellow); color:var(--dark); font-weight:700; padding:0.75rem 1.75rem; border-radius:8px; text-decoration:none; }
    a:hover { opacity:0.9; }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a href="/">Back to home</a>
  </div>
</body>
</html>
